name: Report emails

on:
  schedule:
    - cron: "7,37 * * * *"     # checks every 30 minutes; the day and time of each email are set on the dashboard
  workflow_dispatch:           # "Run workflow" button on the Actions tab
    inputs:
      test:
        description: "Test run: sends all three emails now with [TEST] in the subject, without changing what's due"
        type: boolean
        default: true

permissions:
  contents: write              # only used to note the date of each real send (keeps the schedule switched on)

concurrency:
  group: report-emails         # never two checks at once
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt
      - name: Install
        run: pip install -r report/requirements.txt
      - name: Send what is due
        id: send
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TEST_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '1' || '0' }}
        run: python report/report_emails.py
      - name: Keep the schedule switched on
        # GitHub pauses scheduled jobs in public repositories after 60 days without any change.
        if: github.event_name == 'schedule' && steps.send.outputs.sent == 'yes'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > report/last-run.txt
          git config user.name "dhs-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/last-run.txt
          git commit -m "Report email sent" || true
          git push || true
